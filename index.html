<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFBF7" />
    <title>내 가계부</title>
    <!-- 폰 홈 화면에 앱처럼 추가 (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="가계부" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- 앱 코드가 뜨기 전 잠깐 보이는 시작 화면 (Vue 가 뜨면 #app 안이 바뀌면서 저절로 사라짐) -->
    <div id="app">
      <div class="boot" aria-label="가계부를 여는 중" role="status">
        <img src="/icons/icon-192.png" alt="" width="72" height="72" />
        <span class="boot-name">가계부</span>
        <span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
    <style>
      html, body { margin: 0; background: #FFFBF7; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #FFFBF7; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #7A6E68; }
      .boot img { border-radius: 18px; }
      .boot-name { font-size: 15px; font-weight: 600; }
      .boot-dots { display: flex; gap: 6px; height: 8px; }
      .boot-dots i { width: 6px; height: 6px; border-radius: 50%; background: #E3A38F; animation: boot-dot 1s infinite ease-in-out; }
      .boot-dots i:nth-child(2) { animation-delay: .15s; }
      .boot-dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes boot-dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) { .boot-dots i { animation: none; opacity: .6; } }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
